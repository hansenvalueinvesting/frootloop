name: iOS build

on:
  push:
    # Doc-only pushes don't change the app; skipping them also stops them cancelling an in-flight build.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK → Xcode 26 → macos-26.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build NOOPiOS for device (unsigned, Release)
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Package sideload .ipa
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphoneos) not found"; exit 1; }
          # Keep NOOPWidgets.appex (Home/Lock-Screen widgets + Live Activity) and embed the App Group
          # entitlement in an ad-hoc signature so SideStore/AltStore provisions it when re-signing.
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr Frootloop.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Frootloop-ipa
          path: Frootloop.ipa

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Frootloop.ipa --target "$GITHUB_SHA" \
            --title "Frootloop (latest)" --notes "Unsigned build of $GITHUB_SHA. Sideload with SideStore or AltStore."

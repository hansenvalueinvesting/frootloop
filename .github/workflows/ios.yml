name: iOS build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Frootloop.xcodeproj -scheme Frootloop \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Frootloop.app Payload/
          zip -qr Frootloop.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Frootloop-ipa
          path: Frootloop.ipa

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Frootloop.ipa --target "$GITHUB_SHA" \
            --title "Frootloop (latest)" --notes "Unsigned build of $GITHUB_SHA. Sideload with SideStore or AltStore."
